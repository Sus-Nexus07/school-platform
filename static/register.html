<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduFlow — Create Account</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-left">
      <div class="auth-logo">
        <div class="auth-logo-icon">🎓</div>
        <span class="auth-logo-text">EduFlow</span>
      </div>
      <div class="auth-headline">
        <h1>Start your<br><span>journey.</span></h1>
        <p>Join thousands of students and teachers already using EduFlow to learn and grow.</p>
      </div>
      <div class="auth-stats">
        <div class="auth-stat">
          <strong>12k+</strong>
          <span>Students</span>
        </div>
        <div class="auth-stat">
          <strong>340+</strong>
          <span>Courses</span>
        </div>
        <div class="auth-stat">
          <strong>98%</strong>
          <span>Satisfaction</span>
        </div>
      </div>
    </div>
    <div class="auth-right">
      <div class="auth-form-container">
        <h2>Create account</h2>
        <p>Join EduFlow and start learning today</p>
        <div class="alert alert-error" id="error-msg"></div>
        <div class="alert alert-success" id="success-msg"></div>
        <div class="form-group">
          <label>Full name</label>
          <input type="text" id="name" placeholder="Your full name">
        </div>
        <div class="form-group">
          <label>Email address</label>
          <input type="email" id="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Min. 6 characters">
        </div>
        <div class="form-group">
          <label>I am a</label>
          <select id="role">
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
          </select>
        </div>
        <button class="btn btn-primary" id="register-btn" onclick="register()">
          Create account
        </button>
        <div class="auth-switch">
          Already have an account? <a href="index.html">Sign in</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function register() {
      const btn = document.getElementById('register-btn');
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;

      if (!name || !email || !password) {
        showMsg('error', 'Please fill in all fields');
        return;
      }

      if (password.length < 6) {
        showMsg('error', 'Password must be at least 6 characters');
        return;
      }

      btn.innerHTML = '<span class="spinner"></span>';
      btn.disabled = true;

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, role })
        });

        if (!res.ok) {
          showMsg('error', 'Email already exists. Try signing in.');
          return;
        }

        showMsg('success', 'Account created! Redirecting to login...');
        setTimeout(() => window.location.href = 'index.html', 1500);
      } catch (err) {
        showMsg('error', 'Something went wrong. Try again.');
      } finally {
        btn.innerHTML = 'Create account';
        btn.disabled = false;
      }
    }

    function showMsg(type, msg) {
      document.getElementById('error-msg').classList.remove('show');
      document.getElementById('success-msg').classList.remove('show');
      const el = document.getElementById(type === 'error' ? 'error-msg' : 'success-msg');
      el.textContent = msg;
      el.classList.add('show');
    }
  </script>
</body>
</html>
