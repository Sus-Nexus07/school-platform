<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduFlow — Set New Password</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-left">
      <div class="auth-logo">
        <div class="auth-logo-icon">🎓</div>
        <span class="auth-logo-text">EduFlow</span>
      </div>
      <div class="auth-headline">
        <h1>Almost<br><span>there.</span></h1>
        <p>Choose a new password to secure your account.</p>
      </div>
    </div>
    <div class="auth-right">
      <div class="auth-form-container">
        <h2>Set new password</h2>
        <p>Enter a new password for your account</p>
        <div class="alert alert-error" id="error-msg"></div>
        <div class="alert alert-success" id="success-msg"></div>

        <div id="reset-form">
          <div class="form-group">
            <label>New password</label>
            <input type="password" id="new-password" placeholder="Min. 6 characters">
          </div>
          <div class="form-group">
            <label>Confirm password</label>
            <input type="password" id="confirm-password" placeholder="Re-enter your password">
          </div>
          <button class="btn btn-primary" id="submit-btn" onclick="resetPassword()">
            Reset password
          </button>
        </div>

        <div class="auth-switch">
          <a href="index.html">Back to sign in</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
      showMsg('error', 'Invalid or missing reset token');
      document.getElementById('reset-form').style.display = 'none';
    }

    async function resetPassword() {
      const btn = document.getElementById('submit-btn');
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (!newPassword || !confirmPassword) {
        showMsg('error', 'Please fill in both fields');
        return;
      }

      if (newPassword.length < 6) {
        showMsg('error', 'Password must be at least 6 characters');
        return;
      }

      if (newPassword !== confirmPassword) {
        showMsg('error', 'Passwords do not match');
        return;
      }

      btn.innerHTML = '<span class="spinner"></span>';
      btn.disabled = true;

      try {
        const res = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, new_password: newPassword })
        });

        const data = await res.json();

        if (!res.ok) {
          showMsg('error', data.error || 'Reset failed. Link may be expired.');
          return;
        }

        showMsg('success', 'Password reset! Redirecting to login...');
        document.getElementById('reset-form').style.display = 'none';
        setTimeout(() => window.location.href = 'index.html', 2000);
      } catch (err) {
        showMsg('error', 'Something went wrong. Try again.');
      } finally {
        btn.innerHTML = 'Reset password';
        btn.disabled = false;
      }
    }

    function showMsg(type, msg) {
      document.getElementById('error-msg').classList.remove('show');
      document.getElementById('success-msg').classList.remove('show');
      const el = document.getElementById(type === 'error' ? 'error-msg' : 'success-msg');
      el.textContent = msg;
      el.classList.add('show');
    }
  </script>
</body>
</html>
