<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduFlow — Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-table {
      width: 100%;
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      border-collapse: collapse;
    }
    .admin-table th {
      text-align: left;
      padding: 14px 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      background: var(--gray-100);
      border-bottom: 1px solid var(--gray-200);
    }
    .admin-table td {
      padding: 16px 20px;
      font-size: 14px;
      border-bottom: 1px solid var(--gray-200);
      color: var(--text-primary);
    }
    .admin-table tr:last-child td { border-bottom: none; }
    .role-select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1.5px solid var(--gray-200);
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      background: var(--white);
    }
    .role-tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: capitalize;
    }
    .role-admin { background: rgba(239,68,68,0.1); color: var(--red); }
    .role-teacher { background: var(--blue-glow); color: var(--blue); }
    .role-student { background: rgba(34,197,94,0.1); color: #16A34A; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">🎓</div>
        <span class="sidebar-logo-text">EduFlow</span>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-label">Menu</div>
        <a href="dashboard.html" class="nav-item">
          <span class="nav-icon">🏠</span> Dashboard
        </a>
        <a href="courses.html" class="nav-item">
          <span class="nav-icon">📚</span> Courses
        </a>
        <a href="assignments.html" class="nav-item">
          <span class="nav-icon">📝</span> Assignments
        </a>
        <div class="nav-label" id="admin-nav-label" style="display:none">Admin</div>
        <a href="admin.html" class="nav-item active" id="admin-nav-link" style="display:none">
          <span class="nav-icon">👑</span> Admin Panel
        </a>
      </nav>
      <div class="sidebar-user">
        <div class="user-avatar" id="user-avatar">?</div>
        <div class="user-info">
          <div class="user-name" id="user-name">Loading...</div>
          <div class="user-role" id="user-role">—</div>
        </div>
        <button class="logout-btn" onclick="logout()" title="Sign out">⬅️</button>
      </div>
    </aside>

    <main class="main">
      <div class="page-header">
        <h1>👑 Admin Panel</h1>
        <p>Manage users and view platform statistics</p>
      </div>

      <div class="stats-row" id="stats-row" style="grid-template-columns:repeat(5,1fr)">
        <div class="stat-card">
          <div class="stat-icon blue">👥</div>
          <div class="stat-info">
            <strong id="stat-users">—</strong>
            <span>Total users</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green">🎓</div>
          <div class="stat-info">
            <strong id="stat-students">—</strong>
            <span>Students</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon amber">👨‍🏫</div>
          <div class="stat-info">
            <strong id="stat-teachers">—</strong>
            <span>Teachers</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon blue">📚</div>
          <div class="stat-info">
            <strong id="stat-courses">—</strong>
            <span>Courses</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green">✅</div>
          <div class="stat-info">
            <strong id="stat-enrollments">—</strong>
            <span>Enrollments</span>
          </div>
        </div>
      </div>

      <div class="section-header">
        <h3>All Users</h3>
      </div>

      <table class="admin-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Joined</th>
            <th>Change Role</th>
          </tr>
        </thead>
        <tbody id="users-table-body">
          <tr><td colspan="5" style="text-align:center;padding:40px">Loading...</td></tr>
        </tbody>
      </table>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    requireAuth();

    async function loadAdminPage() {
      const meRes = await apiFetch('/me');
      const user = await meRes.json();

      if (user.role !== 'admin') {
        showToast('Admin access only', 'error');
        setTimeout(() => window.location.href = 'dashboard.html', 1500);
        return;
      }

      document.getElementById('user-avatar').textContent = 'A';
      document.getElementById('user-name').textContent = user.name;
      document.getElementById('user-role').textContent = user.role;
      document.getElementById('admin-nav-label').style.display = 'block';
      document.getElementById('admin-nav-link').style.display = 'flex';

      loadStats();
      loadUsers();
    }

    async function loadStats() {
      const res = await apiFetch('/admin/stats');
      const stats = await res.json();

      document.getElementById('stat-users').textContent = stats.total_users;
      document.getElementById('stat-students').textContent = stats.total_students;
      document.getElementById('stat-teachers').textContent = stats.total_teachers;
      document.getElementById('stat-courses').textContent = stats.total_courses;
      document.getElementById('stat-enrollments').textContent = stats.total_enrollments;
    }

    async function loadUsers() {
      const res = await apiFetch('/admin/users');
      const users = await res.json();
      const tbody = document.getElementById('users-table-body');

      if (users.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:40px">No users found</td></tr>`;
        return;
      }

      tbody.innerHTML = users.map(u => `
        <tr>
          <td><strong>${u.name}</strong></td>
          <td>${u.email}</td>
          <td><span class="role-tag role-${u.role}">${u.role}</span></td>
          <td>${new Date(u.created_at).toLocaleDateString()}</td>
          <td>
            <select class="role-select" onchange="changeRole(${u.id}, this.value)">
              <option value="student" ${u.role === 'student' ? 'selected' : ''}>Student</option>
              <option value="teacher" ${u.role === 'teacher' ? 'selected' : ''}>Teacher</option>
              <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option>
            </select>
          </td>
        </tr>`).join('');
    }

    async function changeRole(userId, newRole) {
      const res = await apiFetch(`/admin/users/${userId}/role`, {
        method: 'PATCH',
        body: JSON.stringify({ role: newRole })
      });

      if (res.ok) {
        showToast(`Role updated to ${newRole}`);
        loadUsers();
        loadStats();
      } else {
        showToast('Failed to update role', 'error');
        loadUsers();
      }
    }

    loadAdminPage();
  </script>
</body>
</html>
