<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduFlow — Reset Password</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-left">
      <div class="auth-logo">
        <div class="auth-logo-icon">🎓</div>
        <span class="auth-logo-text">EduFlow</span>
      </div>
      <div class="auth-headline">
        <h1>Forgot your<br><span>password?</span></h1>
        <p>No worries. Enter your email and we'll help you get back in.</p>
      </div>
    </div>
    <div class="auth-right">
      <div class="auth-form-container">
        <h2>Reset password</h2>
        <p>Enter the email associated with your account</p>
        <div class="alert alert-error" id="error-msg"></div>
        <div class="alert alert-success" id="success-msg"></div>

        <div id="request-form">
          <div class="form-group">
            <label>Email address</label>
            <input type="email" id="email" placeholder="you@example.com">
          </div>
          <button class="btn btn-primary" id="submit-btn" onclick="requestReset()">
            Send reset link
          </button>
        </div>

        <div id="link-display" style="display:none">
          <div class="form-group">
            <label>Your reset link (dev mode)</label>
            <input type="text" id="reset-link-output" readonly style="font-size:12px">
          </div>
          <a class="btn btn-primary" id="go-to-reset" style="text-decoration:none;display:flex">
            Continue to reset →
          </a>
        </div>

        <div class="auth-switch">
          Remember your password? <a href="index.html">Sign in</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function requestReset() {
      const btn = document.getElementById('submit-btn');
      const email = document.getElementById('email').value.trim();

      if (!email) {
        showMsg('error', 'Please enter your email');
        return;
      }

      btn.innerHTML = '<span class="spinner"></span>';
      btn.disabled = true;

      try {
        const res = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await res.json();

        showMsg('success', data.message);

        if (data.reset_link) {
          document.getElementById('reset-link-output').value = data.reset_link;
          document.getElementById('go-to-reset').href = data.reset_link;
          document.getElementById('request-form').style.display = 'none';
          document.getElementById('link-display').style.display = 'block';
        }
      } catch (err) {
        showMsg('error', 'Something went wrong. Try again.');
      } finally {
        btn.innerHTML = 'Send reset link';
        btn.disabled = false;
      }
    }

    function showMsg(type, msg) {
      document.getElementById('error-msg').classList.remove('show');
      document.getElementById('success-msg').classList.remove('show');
      const el = document.getElementById(type === 'error' ? 'error-msg' : 'success-msg');
      el.textContent = msg;
      el.classList.add('show');
    }
  </script>
</body>
</html>
