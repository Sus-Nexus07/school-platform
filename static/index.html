<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduFlow — Sign In</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-left">
      <div class="auth-logo">
        <div class="auth-logo-icon">🎓</div>
        <span class="auth-logo-text">EduFlow</span>
      </div>
      <div class="auth-headline">
        <h1>Learn without<br><span>limits.</span></h1>
        <p>A modern platform where teachers create, students grow, and knowledge flows freely.</p>
      </div>
      <div class="auth-stats">
        <div class="auth-stat">
          <strong>12k+</strong>
          <span>Students</span>
        </div>
        <div class="auth-stat">
          <strong>340+</strong>
          <span>Courses</span>
        </div>
        <div class="auth-stat">
          <strong>98%</strong>
          <span>Satisfaction</span>
        </div>
      </div>
    </div>
    <div class="auth-right">
      <div class="auth-form-container">
        <h2>Welcome back</h2>
        <p>Sign in to continue your learning journey</p>
        <div class="alert alert-error" id="error-msg"></div>
        <div class="form-group">
          <label>Email address</label>
          <input type="email" id="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter your password">
        </div>
        <button class="btn btn-primary" id="login-btn" onclick="login()">
          Sign in
        </button>
        <div class="auth-switch">
          Don't have an account? <a href="register.html">Create one</a>
        </div>
        <div class="auth-switch">
          <a href="forgot-password.html">Forgot your password?</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    if (localStorage.getItem('token')) {
      window.location.href = 'dashboard.html';
    }

    async function login() {
      const btn = document.getElementById('login-btn');
      const error = document.getElementById('error-msg');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showError('Please fill in all fields');
        return;
      }

      btn.innerHTML = '<span class="spinner"></span>';
      btn.disabled = true;
      error.classList.remove('show');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          showError('Invalid email or password');
          return;
        }

        localStorage.setItem('token', data.token);

        const payload = JSON.parse(atob(data.token.split('.')[1]));
        localStorage.setItem('role', payload.role);
        localStorage.setItem('userId', payload.userId);

        window.location.href = 'dashboard.html';
      } catch (err) {
        showError('Something went wrong. Try again.');
      } finally {
        btn.innerHTML = 'Sign in';
        btn.disabled = false;
      }
    }

    function showError(msg) {
      const error = document.getElementById('error-msg');
      error.textContent = msg;
      error.classList.add('show');
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
